[project]
name = "tonton"
version = "0.1.0"
description = "Rotas em Messejana: grafo OSM + trânsito TomTom + Dijkstra"
requires-python = ">=3.10"
dependencies = ["osmnx>=2.0", "matplotlib>=3.8", "requests>=2.31", "python-dotenv>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
